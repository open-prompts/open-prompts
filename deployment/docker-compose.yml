version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: open_prompts
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01_init.sql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ../backend
    restart: on-failure
    ports:
      - "50051:50051"
      - "8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://user:password@postgres:5432/open_prompts?sslmode=disable}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      # SMTP Configuration
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      # Admin console bootstrap (empty ADMIN_BOOTSTRAP_EMAIL disables it)
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      ADMIN_SESSION_TTL_MINUTES: ${ADMIN_SESSION_TTL_MINUTES:-30}
      # Notification retention (days)
      NOTIFICATION_READ_RETENTION_DAYS: ${NOTIFICATION_READ_RETENTION_DAYS:-90}
      NOTIFICATION_RETENTION_DAYS: ${NOTIFICATION_RETENTION_DAYS:-180}
    depends_on:
      - postgres
      - redis

  frontend:
    build: ../frontend
    ports:
      - "3000:80"
    environment:
      # nginx.conf is rendered via the nginx:alpine envsubst template
      # mechanism; these values are substituted at container start.
      # BACKEND_HOST must match the compose service name; NGINX_RESOLVER
      # points at Docker's embedded DNS.
      BACKEND_HOST: backend
      NGINX_RESOLVER: 127.0.0.11
    depends_on:
      - backend

volumes:
  postgres_data:
