version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: open_prompts
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01_init.sql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ../backend
    restart: on-failure
    ports:
      - "50051:50051"
      - "8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://user:password@postgres:5432/open_prompts?sslmode=disable}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      # SMTP Configuration
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      # Admin console bootstrap (empty ADMIN_BOOTSTRAP_EMAIL disables it)
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      ADMIN_SESSION_TTL_MINUTES: ${ADMIN_SESSION_TTL_MINUTES:-30}
      # Notification retention (days)
      NOTIFICATION_READ_RETENTION_DAYS: ${NOTIFICATION_READ_RETENTION_DAYS:-90}
      NOTIFICATION_RETENTION_DAYS: ${NOTIFICATION_RETENTION_DAYS:-180}
      # Follow rate limit (successful follow/unfollow per minute per account)
      FOLLOW_RATE_PER_MINUTE: ${FOLLOW_RATE_PER_MINUTE:-30}
      # Prompt analytics: per-IP view-event rate limit (per minute)
      TEMPLATE_EVENT_RATE_PER_MINUTE: ${TEMPLATE_EVENT_RATE_PER_MINUTE:-60}
      # Template ratings: rating changes per minute per account + top_rated
      # sort minimum rating_count threshold
      RATING_RATE_PER_MINUTE: ${RATING_RATE_PER_MINUTE:-20}
      TOP_RATED_MIN_RATINGS: ${TOP_RATED_MIN_RATINGS:-5}
      # Moderation appeals: max simultaneous open appeals per user
      APPEAL_MAX_OPEN: ${APPEAL_MAX_OPEN:-5}
      # Content reporting: max report submissions per user per hour
      REPORT_RATE_PER_HOUR: ${REPORT_RATE_PER_HOUR:-20}
      # Template moderation: per-admin write rate limit + soft-delete window
      MOD_ACTION_RATE_PER_MINUTE: ${MOD_ACTION_RATE_PER_MINUTE:-10}
      MOD_SOFT_DELETE_WINDOW_DAYS: ${MOD_SOFT_DELETE_WINDOW_DAYS:-30}
      # Notification preferences: max PATCH preference changes per minute
      NOTIF_PREFS_RATE_PER_MINUTE: ${NOTIF_PREFS_RATE_PER_MINUTE:-30}
    depends_on:
      - postgres
      - redis

  frontend:
    build: ../frontend
    ports:
      - "3000:80"
    environment:
      # nginx.conf is rendered via the nginx:alpine envsubst template
      # mechanism; these values are substituted at container start.
      # BACKEND_HOST must match the compose service name; NGINX_RESOLVER
      # points at Docker's embedded DNS.
      BACKEND_HOST: backend
      NGINX_RESOLVER: 127.0.0.11
    depends_on:
      - backend

volumes:
  postgres_data:
