replicaCount: 1

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

backend:
  replicaCount: 1
  image:
    repository: sanmuny1987/open-prompts-backend
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 8080
    grpcPort: 50051
  env:
    # Set this to external database url or use the internal postgres (default)
    databaseUrl: ""
    redisAddr: ""
    smtpHost: ""
    smtpPort: ""
    smtpUser: ""
    smtpPassword: ""
    smtpFrom: ""
    # Admin console bootstrap (empty adminBootstrapEmail disables it)
    adminBootstrapEmail: ""
    adminBootstrapPassword: ""
    adminSessionTtlMinutes: "30"
    # Notification retention (days)
    notificationReadRetentionDays: "90"
    notificationRetentionDays: "180"
    # Follow rate limit (successful follow/unfollow per minute per account)
    followRatePerMinute: "30"
    # Prompt analytics: per-IP view-event rate limit (per minute)
    templateEventRatePerMinute: "60"
    # Template ratings: rating changes per minute per account + top_rated
    # sort minimum rating_count threshold
    ratingRatePerMinute: "20"
    topRatedMinRatings: "5"
    # Moderation appeals: max simultaneous open appeals per user
    appealMaxOpen: "5"
    # Content reporting: max report submissions per user per hour
    reportRatePerHour: "20"
    # Template moderation: per-admin write rate limit + soft-delete window
    modActionRatePerMinute: "10"
    modSoftDeleteWindowDays: "30"

frontend:
  replicaCount: 1
  image:
    repository: sanmuny1987/open-prompts-frontend
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 80
  # IP of the kube-dns service (nginx resolves the backend Service at request
  # time through this resolver). Verify with:
  #   kubectl get svc -n kube-system kube-dns -o jsonpath='{.spec.clusterIP}'
  nginxResolver: "10.96.0.10"

postgres:
  enabled: true
  image:
    repository: postgres
    tag: 15-alpine
    pullPolicy: IfNotPresent
  auth:
    username: user
    password: password
    database: open_prompts
  service:
    port: 5432
  persistence:
    enabled: false
    size: 8Gi
    storageClass: ""

redis:
  enabled: true
  image:
    repository: redis
    tag: 7-alpine
    pullPolicy: IfNotPresent
  service:
    port: 6379

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
