syntax = "proto3";

package v1;

import "google/protobuf/timestamp.proto";

option go_package = "open-prompts/backend/api/proto/v1;v1";

// AdminService defines administrative RPCs. Every RPC except AdminLogin
// requires an admin-scoped JWT (role=admin, scope=admin).
service AdminService {
  // AdminLogin authenticates an admin and returns a short-lived admin token.
  rpc AdminLogin(AdminLoginRequest) returns (AdminLoginResponse);

  // RefreshAdminSession renews the admin token (sliding expiration).
  rpc RefreshAdminSession(RefreshAdminSessionRequest) returns (RefreshAdminSessionResponse);

  // GetAdminStats returns dashboard KPIs and recent activity.
  rpc GetAdminStats(GetAdminStatsRequest) returns (GetAdminStatsResponse);

  // ListUsers returns a paginated, searchable, filterable user list.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);

  // GetUser returns full admin detail for one user.
  rpc GetUser(GetUserRequest) returns (GetUserResponse);

  // BanUser bans a user (reason required).
  rpc BanUser(BanUserRequest) returns (UserActionResponse);

  // UnbanUser lifts a ban (reason required).
  rpc UnbanUser(UnbanUserRequest) returns (UserActionResponse);

  // ChangeUserRole promotes/demotes (reason required; self-demotion rejected).
  rpc ChangeUserRole(ChangeUserRoleRequest) returns (UserActionResponse);

  // ListTemplates returns a paginated moderation list of ALL templates.
  rpc ListTemplates(ListAdminTemplatesRequest) returns (ListAdminTemplatesResponse);

  // GetTemplate returns any template with all versions (read-only).
  rpc GetTemplate(GetAdminTemplateRequest) returns (GetAdminTemplateResponse);

  // ListAuditLogs returns the append-only audit trail.
  rpc ListAuditLogs(ListAuditLogsRequest) returns (ListAuditLogsResponse);

  // ListAdminComments lists all comments platform-wide (moderation).
  rpc ListAdminComments(ListAdminCommentsRequest) returns (ListAdminCommentsResponse);

  // DeleteAdminComment deletes any comment with a mandatory reason (audited).
  rpc DeleteAdminComment(DeleteAdminCommentRequest) returns (DeleteAdminCommentResponse);

  // ListReviewQueue returns the pending pre-publication review queue
  // (aging-first, then FIFO).
  rpc ListReviewQueue(ListReviewQueueRequest) returns (ListReviewQueueResponse);

  // GetReviewSubmission returns full review detail for one submission.
  rpc GetReviewSubmission(GetReviewSubmissionRequest) returns (GetReviewSubmissionResponse);

  // ApproveReviewSubmission approves a pending submission; the template
  // goes live and the creator is notified.
  rpc ApproveReviewSubmission(ApproveReviewSubmissionRequest) returns (ReviewDecisionResponse);

  // RejectReviewSubmission rejects a pending submission with a mandatory
  // reason code; the creator is notified with the reason.
  rpc RejectReviewSubmission(RejectReviewSubmissionRequest) returns (ReviewDecisionResponse);

  // GetReviewMetrics returns queue KPIs (open count, median wait,
  // decisions today, rejection rate by reason).
  rpc GetReviewMetrics(GetReviewMetricsRequest) returns (ReviewMetrics);

  // GetPlatformSettings lists the admin-editable platform settings.
  rpc GetPlatformSettings(GetPlatformSettingsRequest) returns (GetPlatformSettingsResponse);

  // UpdatePlatformSetting updates one platform setting (reason-audited).
  rpc UpdatePlatformSetting(UpdatePlatformSettingRequest) returns (PlatformSettingEntry);

  // UpdateTemplateWarnings adds/removes content warnings on a template with a
  // mandatory reason (audited, creator notified).
  rpc UpdateTemplateWarnings(UpdateTemplateWarningsRequest) returns (UpdateTemplateWarningsResponse);

  // ListWarningHistory returns the warning-change history for a template.
  rpc ListWarningHistory(ListWarningHistoryRequest) returns (ListWarningHistoryResponse);

  // ListAppealQueue returns the appeal queue, oldest-first within state,
  // with per-state counts.
  rpc ListAppealQueue(ListAppealQueueRequest) returns (ListAppealQueueResponse);

  // GetAppeal returns full appeal detail plus the original action's audit
  // context.
  rpc GetAppeal(GetAdminAppealRequest) returns (AdminAppealDetail);

  // ReviewAppeal moves an open appeal to under_review.
  rpc ReviewAppeal(ReviewAppealRequest) returns (AdminAppealDetail);

  // ResolveAppeal resolves an appeal as upheld or reversed; reversed
  // restores the template atomically.
  rpc ResolveAppeal(ResolveAppealRequest) returns (AdminAppealDetail);

  // ListReportQueue returns the grouped report queue, open-first by count
  // then recency, with filters.
  rpc ListReportQueue(ListReportQueueRequest) returns (ListReportQueueResponse);

  // GetReportDetail returns full context for a reported item plus every
  // report (reporter, reason, note, time).
  rpc GetReportDetail(GetReportDetailRequest) returns (AdminReportDetail);

  // ResolveReportGroup resolves all open reports of an item atomically as
  // dismissed or actioned (409 when none are open).
  rpc ResolveReportGroup(ResolveReportGroupRequest) returns (ResolveReportGroupResponse);
}

message ListReportQueueRequest {
  string status = 1;    // "" | "open" | "resolved"
  string item_type = 2; // "" | "template" | "comment"
  string reason = 3;    // "" | spam | offensive | misleading | privacy | other
  int32 page = 4;       // 1-based, default 1
  int32 per_page = 5;   // default 50, max 100
}

message ListReportQueueResponse {
  repeated AdminReportGroup groups = 1;
  int64 total = 2;
  int32 page = 3;
  int32 per_page = 4;
}

message AdminReportGroup {
  string item_type = 1;
  string item_id = 2;
  string item_title = 3;        // template title or comment snippet
  string author_display_name = 4;
  int32 open_count = 5;
  repeated string reasons = 6;  // distinct reason codes
  google.protobuf.Timestamp latest_at = 7;
  string status = 8;            // open | resolved
}

message GetReportDetailRequest {
  string item_type = 1;
  string item_id = 2;
}

message AdminReportDetail {
  string item_type = 1;
  string item_id = 2;
  string item_title = 3;
  string item_content = 4;      // template preview or comment text
  string author_id = 5;
  string author_display_name = 6;
  repeated AdminReportEntry reports = 7;
}

message AdminReportEntry {
  string id = 1;
  string reporter_id = 2;
  string reporter_display_name = 3;
  string reason = 4;
  string note = 5;
  google.protobuf.Timestamp created_at = 6;
}

message ResolveReportGroupRequest {
  string item_type = 1;
  string item_id = 2;
  string resolution = 3; // "dismissed" | "actioned"
  string reason = 4;     // 3-500 chars, required
}

message ResolveReportGroupResponse {
  bool success = 1;
  int32 resolved_count = 2;
}

message ListAppealQueueRequest {
  string state = 1;   // "" | "open" | "under_review" | "resolved"
  int32 page = 2;
  int32 per_page = 3;
}

message ListAppealQueueResponse {
  repeated AdminAppealEntry entries = 1;
  int32 open_count = 2;
  int32 under_review_count = 3;
  int32 resolved_count = 4;
  int64 total = 5;
  int32 page = 6;
  int32 per_page = 7;
}

message AdminAppealEntry {
  string id = 1;
  string template_id = 2;
  string template_title = 3;
  string action_type = 4;
  string statement_excerpt = 5;   // first ~80 chars
  string state = 6;
  google.protobuf.Timestamp created_at = 7;
  string appellant_display_name = 8;
}

message GetAdminAppealRequest {
  string appeal_id = 1;
}

message ReviewAppealRequest {
  string appeal_id = 1;
}

message ResolveAppealRequest {
  string appeal_id = 1;
  string outcome = 2;  // "upheld" | "reversed"
  string note = 3;     // 20-1000 chars, required
}

message AdminAppealDetail {
  string id = 1;
  string moderation_action_id = 2;
  string template_id = 3;
  string template_title = 4;
  string action_type = 5;
  string action_reason = 6;
  string action_actor_id = 7;
  string action_actor_email = 8;
  google.protobuf.Timestamp action_created_at = 9;
  string statement = 10;
  string state = 11;
  string appellant_id = 12;
  string appellant_display_name = 13;
  string resolution_note = 14;
  string resolver_id = 15;
  google.protobuf.Timestamp created_at = 16;
  google.protobuf.Timestamp resolved_at = 17;
  bool superseded = 18;
  string audit_entry_id = 19;   // the original action's audit entry id (if any)
}

// ---- Auth ----

message AdminLoginRequest {
  string email = 1;
  string password = 2;
}

message AdminLoginResponse {
  string token = 1; // admin-scoped JWT, exp = now + ADMIN_SESSION_TTL_MINUTES
  AdminUserSummary user = 2;
}

message RefreshAdminSessionRequest {}

message RefreshAdminSessionResponse {
  string token = 1;
}

// ---- Stats ----

message GetAdminStatsRequest {}

message GetAdminStatsResponse {
  int64 total_users = 1;
  int64 active_users = 2;
  int64 banned_users = 3;
  int64 total_templates = 4;
  int64 public_templates = 5;
  int64 prompts_created = 6;
  repeated AdminUserSummary recent_signups = 7; // latest 10
  repeated AdminTemplateSummary recent_templates = 8; // latest 10 public, by updated_at
  int64 open_reports = 9; // open report count for the dashboard KPI (FR-13)
}

// ---- Users ----

message AdminUserSummary {
  string id = 1;
  string email = 2;
  string display_name = 3;
  string avatar = 4;
  string role = 5; // "user" | "admin"
  string status = 6; // "active" | "banned"
  int32 template_count = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message ListUsersRequest {
  string search = 1; // matches id, email, display_name (case-insensitive)
  string status = 2; // "" | "active" | "banned"
  string role = 3; // "" | "user" | "admin"
  string sort = 4; // "newest" (default) | "oldest" | "recently_updated"
  int32 page = 5; // 1-based
  int32 per_page = 6; // default 20, max 100
}

message ListUsersResponse {
  repeated AdminUserSummary users = 1;
  int64 total = 2;
  int32 page = 3;
  int32 per_page = 4;
}

message GetUserRequest {
  string id = 1;
}

message GetUserResponse {
  AdminUserSummary user = 1;
  UserStats stats = 2;
  repeated OAuthIdentity identities = 3;
  repeated AdminAPIKeySummary api_keys = 4;
  repeated AdminTemplateSummary templates = 5; // latest 5
  repeated AdminAuditLogEntry action_history = 6; // entries targeting this user, latest 20
}

message UserStats {
  int64 templates = 1;
  int64 likes_received = 2;
  int64 favorites_received = 3;
  int64 prompts_created = 4;
  int64 follower_count = 5;
  int64 following_count = 6;
}

message OAuthIdentity {
  string provider = 1;
  google.protobuf.Timestamp created_at = 2;
}

message AdminAPIKeySummary {
  string id = 1;
  string name = 2;
  string prefix = 3;
  bool is_active = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp last_used_at = 6; // null if never used
}

message BanUserRequest {
  string user_id = 1;
  string reason = 2; // 3-500 chars, required
}

message UnbanUserRequest {
  string user_id = 1;
  string reason = 2;
}

message ChangeUserRoleRequest {
  string user_id = 1;
  string role = 2; // "admin" | "user"
  string reason = 3;
}

message UserActionResponse {
  AdminUserSummary user = 1; // post-action state
}

// ---- Templates ----

message AdminTemplateSummary {
  string id = 1;
  string title = 2;
  string visibility = 3; // "public" | "private"
  string type = 4; // "system" | "user"
  string language = 5;
  repeated string tags = 6;
  int32 like_count = 7;
  int32 favorite_count = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  string owner_id = 11;
  string owner_display_name = 12;
  string category = 13; // NEW — required for admin export parity (FR-2)
  // Average rating (0 when rating_count = 0; computed, never stored).
  double rating_avg = 14;
  // Active content warnings (taxonomy keys).
  repeated string content_warnings = 15;
  // The subset applied by moderation; creator-immutable.
  repeated string locked_warnings = 16;
  // Number of ratings.
  int32 rating_count = 17;
}

message ListAdminTemplatesRequest {
  string search = 1; // matches title or owner id/display_name
  string visibility = 2; // "" | "public" | "private"
  string owner_id = 3; // deep-link filter from user detail
  string sort = 4; // "recently_updated" (default) | "newest" | "oldest" | "most_likes"
  int32 page = 5;
  int32 per_page = 6;
  string warning = 7; // "" = any | "none" | a taxonomy key (mature|violence|profanity|sensitive)
}

message ListAdminTemplatesResponse {
  repeated AdminTemplateSummary templates = 1;
  int64 total = 2;
  int32 page = 3;
  int32 per_page = 4;
}

message GetAdminTemplateRequest {
  string id = 1;
}

message GetAdminTemplateResponse {
  AdminTemplateSummary template = 1;
  string description = 2;
  repeated AdminTemplateVersion versions = 3; // all versions, newest first
}

message AdminTemplateVersion {
  int32 id = 1;
  int32 version = 2;
  string content = 3;
  google.protobuf.Timestamp created_at = 4;
  string alias_name = 5; // "" if no alias points at this version
  string change_note = 6; // NEW — "" when the version has none
}

// ---- Audit ----

message AdminAuditLogEntry {
  string id = 1;
  string actor_id = 2;
  string actor_email = 3;
  string action = 4; // "ban" | "unban" | "role_change" | "delete_comment"
  string target_type = 5; // "user" | "comment"
  string target_id = 6;
  string reason = 7;
  google.protobuf.Timestamp created_at = 8;
}

message ListAuditLogsRequest {
  string action = 1; // "" | "ban" | "unban" | "role_change" | "delete_comment"
  string actor = 2; // matches actor_id or actor_email
  int32 page = 3;
  int32 per_page = 4;
}

message ListAuditLogsResponse {
  repeated AdminAuditLogEntry entries = 1;
  int64 total = 2;
  int32 page = 3;
  int32 per_page = 4;
}

// AdminCommentEntry is a comment with moderation context.
message AdminCommentEntry {
  string id = 1;
  string template_id = 2;
  string template_title = 3;
  string template_owner_id = 4;
  string template_owner_display_name = 5;
  string user_id = 6; // author id
  string user_display_name = 7; // author display name
  string user_email = 8; // author email (moderation only)
  string content = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  // Display name of the parent comment's author; empty for top-level comments.
  string parent_author_display_name = 12;
}

message ListAdminCommentsRequest {
  string q = 1; // free-text: matches content
  string template_id = 2;
  string user_id = 3; // author filter
  int32 page = 4; // 1-based, default 1
  int32 per_page = 5; // default 20, max 100
}

message ListAdminCommentsResponse {
  repeated AdminCommentEntry entries = 1;
  int64 total = 2;
  int32 page = 3;
  int32 per_page = 4;
}

message DeleteAdminCommentRequest {
  string comment_id = 1;
  string reason = 2; // 3-500 chars, required
}

message DeleteAdminCommentResponse {
  bool success = 1;
}

// ---- Pre-publication review ----

message ListReviewQueueRequest {
  string category = 1; // "" = any
  bool aging_only = 2; // only submissions older than the aging window
  bool resubmission_only = 3; // only attempt_number >= 2
  int32 page = 4; // 1-based, default 1
  int32 per_page = 5; // default 20, max 100
}

message ReviewQueueItem {
  string id = 1; // submission id
  string template_id = 2;
  string template_title = 3;
  string creator_id = 4;
  string creator_display_name = 5;
  int32 attempt_number = 6; // >= 2 renders the "(nth)" chip
  bool is_resubmission = 7; // attempt_number >= 2
  google.protobuf.Timestamp submitted_at = 8;
  string category = 9;
  bool aging = 10; // submitted_at older than the aging window
  int32 creator_approved_count = 11; // users.approved_template_count
  int32 creator_prior_rejections = 12; // rejected submissions by this creator
  bool creator_banned = 13; // banned-mid-review flag
}

message ListReviewQueueResponse {
  repeated ReviewQueueItem items = 1;
  int64 total = 2;
  int32 page = 3;
  int32 per_page = 4;
}

message GetReviewSubmissionRequest {
  string id = 1; // submission id
}

message ReviewChainEntry {
  int32 attempt_number = 1;
  string status = 2; // "approved" | "rejected"
  google.protobuf.Timestamp submitted_at = 3;
  google.protobuf.Timestamp decided_at = 4;
  string reject_reason_code = 5; // empty for approvals
  string reject_note = 6;
}

message ReviewSubmissionDetail {
  string id = 1;
  string template_id = 2;
  string template_title = 3;
  string template_description = 4;
  string template_content = 5; // latest version content
  repeated string tags = 6;
  string category = 7;
  string language = 8;
  string creator_id = 9;
  string creator_display_name = 10;
  google.protobuf.Timestamp creator_joined_at = 11;
  int32 creator_published_count = 12; // approved templates
  int32 creator_prior_rejections = 13;
  bool creator_banned = 14;
  int32 attempt_number = 15;
  google.protobuf.Timestamp submitted_at = 16;
  repeated ReviewChainEntry chain = 17; // prior attempts, oldest first
}

message GetReviewSubmissionResponse {
  ReviewSubmissionDetail submission = 1;
}

message ApproveReviewSubmissionRequest {
  string id = 1; // submission id
}

message RejectReviewSubmissionRequest {
  string id = 1; // submission id
  string reason_code = 2; // required: spam | plagiarism | harmful | lowQuality | other
  string note = 3; // optional, <= 500 chars
}

message ReviewDecisionResponse {
  string submission_id = 1;
  string template_id = 2;
  string status = 3; // "approved" | "rejected"
}

message GetReviewMetricsRequest {}

message RejectionRateEntry {
  string reason_code = 1;
  int32 count = 2;
  double rate = 3; // share of rejections (not of all decisions)
}

message ReviewMetrics {
  int64 open_count = 1;
  // Median hours a currently-open submission has been waiting.
  double median_time_in_review_hours = 2;
  int64 decisions_today = 3;
  repeated RejectionRateEntry rejection_rate_by_reason = 4;
}

message GetPlatformSettingsRequest {}

message PlatformSettingEntry {
  string key = 1;
  string value = 2;
  google.protobuf.Timestamp updated_at = 3;
}

message GetPlatformSettingsResponse {
  repeated PlatformSettingEntry settings = 1;
}

message UpdatePlatformSettingRequest {
  string key = 1; // must exist in the known-keys whitelist
  string value = 2; // integer >= 0 for review_approval_threshold (0 disables gating), >= 1 otherwise
  string reason = 3; // 3-500 chars, audit-logged
}

// ---- Content warnings ----

message UpdateTemplateWarningsRequest {
  string template_id = 1;
  repeated string add = 2;    // warnings to add (taxonomy keys)
  repeated string remove = 3; // warnings to remove (taxonomy keys)
  string reason = 4;          // required, 3-500 chars, audit-logged
}

message UpdateTemplateWarningsResponse {
  string template_id = 1;
  repeated string content_warnings = 2; // post-change full set
  repeated string locked_warnings = 3;  // post-change locked set
}

message ListWarningHistoryRequest {
  string template_id = 1;
  int32 page = 2;    // 1-based, default 1
  int32 per_page = 3; // default 20, max 100
}

message WarningHistoryEntry {
  string id = 1;
  string actor_id = 2;
  string actor_email = 3;
  string action = 4; // "template.warning_add" | "template.warning_remove"
  repeated string warnings = 5; // the warnings added/removed in this change
  string reason = 6;
  google.protobuf.Timestamp created_at = 7;
}

message ListWarningHistoryResponse {
  repeated WarningHistoryEntry entries = 1;
  int64 total = 2;
  int32 page = 3;
  int32 per_page = 4;
}
