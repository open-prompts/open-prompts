syntax = "proto3";

package v1;

import "google/protobuf/timestamp.proto";

option go_package = "open-prompts/backend/api/proto/v1;v1";

// UserService defines the RPC methods for user management.
service UserService {
  // Register creates a new user account.
  rpc Register(RegisterRequest) returns (RegisterResponse);

  // Login authenticates a user and returns a token.
  rpc Login(LoginRequest) returns (LoginResponse);

  // LoginWithOAuth authenticates a user via an OAuth provider.
  rpc LoginWithOAuth(LoginWithOAuthRequest) returns (LoginResponse);

  // SendVerificationCode sends a verification code to the email.
  rpc SendVerificationCode(SendVerificationCodeRequest) returns (SendVerificationCodeResponse);

  // UpdateProfile updates information for the logged-in user.
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);

  // GetProfile retrieves the profile of the logged-in user.
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);

  // Alias RPCs
  rpc CreateAlias(CreateAliasRequest) returns (Alias);
  rpc ListAliases(ListAliasesRequest) returns (ListAliasesResponse);
  rpc UpdateAlias(UpdateAliasRequest) returns (Alias);
  rpc DeleteAlias(DeleteAliasRequest) returns (DeleteTemplateResponse);
  rpc GetPromptByAlias(GetPromptByAliasRequest) returns (TemplateVersion);

  // API Key RPCs
  rpc CreateAPIKey(CreateAPIKeyRequest) returns (CreateAPIKeyResponse);
  rpc ListAPIKeys(ListAPIKeysRequest) returns (ListAPIKeysResponse);
  rpc DeleteAPIKey(DeleteAPIKeyRequest) returns (DeleteAPIKeyResponse);

  // Follow RPCs
  rpc FollowUser(FollowUserRequest) returns (FollowUserResponse);
  rpc UnfollowUser(FollowUserRequest) returns (FollowUserResponse);
  rpc GetCreatorProfile(GetCreatorProfileRequest) returns (GetCreatorProfileResponse);
  rpc ListFollowers(ListUserRelationsRequest) returns (ListUserRelationsResponse);
  rpc ListFollowing(ListUserRelationsRequest) returns (ListUserRelationsResponse);
  rpc GetFollowingFeed(GetFollowingFeedRequest) returns (GetFollowingFeedResponse);
  rpc ListTopCreators(ListTopCreatorsRequest) returns (ListTopCreatorsResponse);
}

// PromptService defines the RPC methods for managing templates and prompts.
service PromptService {
  // Template RPCs

  // CreateTemplate creates a new prompt template.
  rpc CreateTemplate(CreateTemplateRequest) returns (CreateTemplateResponse);

  // UpdateTemplate updates an existing template, creating a new version.
  rpc UpdateTemplate(UpdateTemplateRequest) returns (UpdateTemplateResponse);

  // GetTemplate retrieves a template by ID.
  rpc GetTemplate(GetTemplateRequest) returns (GetTemplateResponse);

  // ListTemplates lists templates with optional filtering.
  rpc ListTemplates(ListTemplatesRequest) returns (ListTemplatesResponse);

  // DeleteTemplate deletes a template.
  rpc DeleteTemplate(DeleteTemplateRequest) returns (DeleteTemplateResponse);

  // ToggleLikeTemplate toggles the like status of a template for the current user.
  rpc ToggleLikeTemplate(ToggleLikeRequest) returns (ToggleLikeResponse);

  // ToggleFavoriteTemplate toggles the favorite status of a template for the current user.
  rpc ToggleFavoriteTemplate(ToggleFavoriteRequest) returns (ToggleFavoriteResponse);

  // Prompt RPCs

  // CreatePrompt creates a new prompt instance from a template.
  rpc CreatePrompt(CreatePromptRequest) returns (CreatePromptResponse);

  // GetPrompt retrieves a prompt by ID.
  rpc GetPrompt(GetPromptRequest) returns (GetPromptResponse);

  // DeletePrompt deletes a prompt.
  rpc DeletePrompt(DeletePromptRequest) returns (DeletePromptResponse);

  // ListCategories lists all categories with their template counts.
  rpc ListCategories(ListCategoriesRequest) returns (ListCategoriesResponse);

  // ListTags lists all tags with their template counts.
  rpc ListTags(ListTagsRequest) returns (ListTagsResponse);

  // ListTemplateVersions lists all versions of a template.
  rpc ListTemplateVersions(ListTemplateVersionsRequest) returns (ListTemplateVersionsResponse);

  // ListComments lists comments for a template (visibility follows the template).
  rpc ListComments(ListCommentsRequest) returns (ListCommentsResponse);

  // CreateComment posts a comment on a template (auth required).
  rpc CreateComment(CreateCommentRequest) returns (Comment);

  // UpdateComment edits the author's own comment within the edit window.
  rpc UpdateComment(UpdateCommentRequest) returns (Comment);

  // DeleteComment deletes a comment (author or template owner).
  rpc DeleteComment(DeleteCommentRequest) returns (DeleteCommentResponse);

  // RecordTemplateEvent records a view event for a template (anonymous
  // allowed; rate-limited per IP). Use events are recorded server-side only.
  rpc RecordTemplateEvent(RecordTemplateEventRequest) returns (RecordTemplateEventResponse);

  // GetTemplateStats returns analytics for a single template (owner only).
  rpc GetTemplateStats(GetTemplateStatsRequest) returns (GetTemplateStatsResponse);

  // GetCreatorStats returns aggregate analytics for the caller's templates.
  rpc GetCreatorStats(GetCreatorStatsRequest) returns (GetCreatorStatsResponse);
}

// Visibility defines who can see the template.
enum Visibility {
  VISIBILITY_UNSPECIFIED = 0;
  VISIBILITY_PRIVATE = 1;
  VISIBILITY_PUBLIC = 2;
}

// TemplateType defines the origin/type of the template.
enum TemplateType {
  TEMPLATE_TYPE_UNSPECIFIED = 0;
  TEMPLATE_TYPE_SYSTEM = 1;
  TEMPLATE_TYPE_USER = 2;
}

// Template represents a prompt template metadata.
message Template {
  // Unique identifier for the template (UUID).
  string id = 1;
  // ID of the user who owns the template.
  string owner_id = 2;
  // Title of the template.
  string title = 3;
  // Description of the template.
  string description = 4;
  // Visibility status (public or private).
  Visibility visibility = 5;
  // Type of the template (system or user).
  TemplateType type = 6;
  // List of tags associated with the template.
  repeated string tags = 7;
  // Category of the template.
  string category = 8;
  // Number of likes.
  int32 like_count = 9;
  // Number of favorites.
  int32 favorite_count = 10;
  // Timestamp when the template was created.
  google.protobuf.Timestamp created_at = 11;
  // Timestamp when the template was last updated.
  google.protobuf.Timestamp updated_at = 12;
  // The latest version of the template.
  TemplateVersion latest_version = 13;
  // Whether the current user has liked this template.
  bool is_liked = 14;
  // Whether the current user has favorited this template.
  bool is_favorited = 15;
  // Language of the template (e.g. "en", "zh").
  string language = 16;
  // Number of comments.
  int32 comment_count = 17;
  // Total deduplicated views (per session per 30 minutes).
  int32 view_count = 23;
  // Total prompts created from this template (web + API).
  int32 use_count = 24;
  // Moderation state: "normal" | "in_review" | "rejected".
  // Only meaningful to the owner and admins; hidden templates 404 for
  // everyone else so the value never leaks.
  string moderation_status = 25;
  // Approval time of the first review approval; null/absent until then.
  google.protobuf.Timestamp published_at = 26;
  // Active content warnings (self-declared + moderator-applied), keys from
  // the config-driven taxonomy (mature | violence | profanity | sensitive).
  repeated string content_warnings = 27;
  // The subset of content_warnings applied by moderation; creator-immutable.
  // Only meaningful to the owner and admins.
  repeated string locked_warnings = 28;
  // Owner display name (joined from users at read time).
  string owner_display_name = 29;
  // Owner avatar (joined from users at read time).
  string owner_avatar = 30;
}

// TemplateVersion represents a specific version of a template's content.
message TemplateVersion {
  // Unique identifier for the version record.
  int32 id = 1;
  // ID of the parent template.
  string template_id = 2;
  // Logical version number (1, 2, 3...).
  int32 version = 3;
  // The actual prompt content with placeholders (e.g., $$).
  string content = 4;
  // Timestamp when this version was created.
  google.protobuf.Timestamp created_at = 5;
  // Optional user-provided change note (empty string when NULL).
  string change_note = 6;
  // Number of prompts pinned to this version (populated by
  // ListTemplateVersions; 0 elsewhere and to be ignored).
  int32 prompt_count = 7;
}

// ListTemplateVersionsRequest is the request message for ListTemplateVersions.
message ListTemplateVersionsRequest {
  string template_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

// ListTemplateVersionsResponse is the response message for ListTemplateVersions.
message ListTemplateVersionsResponse {
  repeated TemplateVersion versions = 1;
  string next_page_token = 2;
}

// Prompt represents an instantiated prompt saved by a user.
message Prompt {
  // Unique identifier for the prompt (UUID).
  string id = 1;
  // ID of the template used.
  string template_id = 2;
  // ID of the specific version used.
  int32 version_id = 3;
  // ID of the user who saved this prompt.
  string owner_id = 4;
  // Map of variable values used to replace placeholders.
  map<string, string> variables = 5;
  // Timestamp when the prompt was created.
  google.protobuf.Timestamp created_at = 6;
  // The actual rendered content of the prompt.
  string content = 7;
}

// CreateTemplateRequest is the request message for CreateTemplate.
message CreateTemplateRequest {
  string owner_id = 1;
  string title = 2;
  string description = 3;
  Visibility visibility = 4;
  TemplateType type = 5;
  repeated string tags = 6;
  string category = 7;
  // Initial content for the first version.
  string content = 8;
  // Language of the template.
  string language = 9;
  // Content warning keys from the taxonomy; validated server-side.
  repeated string content_warnings = 10;
}

// CreateTemplateResponse is the response message for CreateTemplate.
message CreateTemplateResponse {
  Template template = 1;
  TemplateVersion version = 2;
}

// UpdateTemplateRequest is the request message for UpdateTemplate.
message UpdateTemplateRequest {
  string template_id = 1;
  string owner_id = 2; // For authorization check
  string title = 3;
  string description = 4;
  Visibility visibility = 5;
  repeated string tags = 6;
  string category = 7;
  // New content, which triggers a new version creation.
  string content = 8;
  // Language of the template.
  string language = 9;
  // Optional change note for the new version (max 200 chars).
  // Ignored when content is unchanged (no version is created).
  string change_note = 10;
  // Full desired content-warning set; locked warnings are enforced server-side.
  repeated string content_warnings = 11;
}

// UpdateTemplateResponse is the response message for UpdateTemplate.
message UpdateTemplateResponse {
  Template template = 1;
  TemplateVersion new_version = 2;
}

// GetTemplateRequest is the request message for GetTemplate.
message GetTemplateRequest {
  string id = 1;
}

// GetTemplateResponse is the response message for GetTemplate.
message GetTemplateResponse {
  Template template = 1;
  // Optionally return the latest version or all versions.
  // For simplicity, let's return the latest version.
  TemplateVersion latest_version = 2;
  // Public owner identity (id, display_name, avatar, follower_count,
  // is_following). Populated when the owner is resolvable.
  OwnerInfo owner = 3;
}

// ListTemplatesRequest is the request message for ListTemplates.
message ListTemplatesRequest {
  int32 page_size = 1;
  string page_token = 2;
  // Filter by visibility (e.g., public only, or my private ones).
  Visibility visibility = 3;
  // Filter by owner.
  string owner_id = 4;
  // Filter by category.
  string category = 5;
  // Filter by tags.
  repeated string tags = 6;
  // Filter by user likes.
  bool my_likes = 7;
  // Filter by user favorites.
  bool my_favorites = 8;
  // Filter by language.
  string language = 9;
  // Free-text keyword; matched case-insensitively against title,
  // description, category, tags, and latest-version content.
  string keyword = 10;
  // Sort order: newest (default) | most_liked | most_favorited | trending.
  // Invalid values fall back to newest server-side.
  string sort = 11;
  // When true, filter out templates with any content warning (public stream only).
  bool exclude_warned = 12;
}

// ListTemplatesResponse is the response message for ListTemplates.
message ListTemplatesResponse {
  repeated Template templates = 1; // Used for public templates when mixed
  string next_page_token = 2; // Used for public pagination when mixed
  repeated Template private_templates = 3;
  string private_next_page_token = 4;
  // Total matches in the public/single stream for the current filters.
  int32 total_count = 5;
  // Total matches in the private stream (mixed view only; else 0).
  int32 private_total_count = 6;
}

// DeleteTemplateRequest is the request message for DeleteTemplate.
message DeleteTemplateRequest {
  string id = 1;
  string owner_id = 2; // For auth
}

// DeleteTemplateResponse is the response message for DeleteTemplate.
message DeleteTemplateResponse {
  bool success = 1;
}

// ToggleLikeRequest is the request message for ToggleLikeTemplate.
message ToggleLikeRequest {
  string template_id = 1;
}

// ToggleLikeResponse is the response message for ToggleLikeTemplate.
message ToggleLikeResponse {
  bool is_liked = 1;
  int32 like_count = 2;
}

// ToggleFavoriteRequest is the request message for ToggleFavoriteTemplate.
message ToggleFavoriteRequest {
  string template_id = 1;
}

// ToggleFavoriteResponse is the response message for ToggleFavoriteTemplate.
message ToggleFavoriteResponse {
  bool is_favorited = 1;
  int32 favorite_count = 2;
}

// CreatePromptRequest is the request message for CreatePrompt.
message CreatePromptRequest {
  string template_id = 1;
  int32 version_id = 2;
  string owner_id = 3;
  map<string, string> variables = 4;
}

// CreatePromptResponse is the response message for CreatePrompt.
message CreatePromptResponse {
  Prompt prompt = 1;
}

// GetPromptRequest is the request message for GetPrompt.
message GetPromptRequest {
  string id = 1;
}

// GetPromptResponse is the response message for GetPrompt.
message GetPromptResponse {
  Prompt prompt = 1;
}

// ListPromptsRequest is the request message for ListPrompts.
message ListPromptsRequest {
  int32 page_size = 1;
  string page_token = 2;
  string owner_id = 3;
  // Filter by template_id.
  string template_id = 4;
}

// ListPromptsResponse is the response message for ListPrompts.
message ListPromptsResponse {
  repeated Prompt prompts = 1;
  string next_page_token = 2;
}

// DeletePromptRequest is the request message for DeletePrompt.
message DeletePromptRequest {
  string id = 1;
  string owner_id = 2; // For auth
}

// DeletePromptResponse is the response message for DeletePrompt.
message DeletePromptResponse {
  bool success = 1;
}

// RegisterRequest is the request message for Register.
message RegisterRequest {
  string id = 1;
  string email = 2;
  string mobile = 3;
  string password = 4;
  string display_name = 5;
  string verification_code = 6;
}

// RegisterResponse is the response message for Register.
message RegisterResponse {
  string id = 1;
  string token = 2; // JWT token
}

// LoginRequest is the request message for Login.
message LoginRequest {
  string email = 1; // Or mobile/id
  string password = 2;
}

// LoginResponse is the response message for Login.
message LoginResponse {
  string id = 1;
  string token = 2;
  string display_name = 3;
  string avatar = 4;
}

// LoginWithOAuthRequest is the request message for LoginWithOAuth.
message LoginWithOAuthRequest {
  string provider = 1;
  string code = 2;
}

message SendVerificationCodeRequest {
  string email = 1;
  string language = 2; // "en" or "zh"
}

message SendVerificationCodeResponse {
  bool success = 1;
}

// ListCategoriesRequest is the request message for ListCategories.
message ListCategoriesRequest {
  string owner_id = 1;
  string language = 2;
}

// CategoryStats represents a category and its usage count.
message CategoryStats {
  string name = 1;
  int32 count = 2;
}

// ListCategoriesResponse is the response message for ListCategories.
message ListCategoriesResponse {
  repeated CategoryStats categories = 1;
}

// ListTagsRequest is the request message for ListTags.
message ListTagsRequest {
  string language = 1;
}

// TagStats represents a tag and its usage count.
message TagStats {
  string name = 1;
  int32 count = 2;
}

// ListTagsResponse is the response message for ListTags.
message ListTagsResponse {
  repeated TagStats tags = 1;
}

// UpdateProfileRequest is the request message for UpdateProfile.
message UpdateProfileRequest {
  string id = 1;
  string display_name = 2;
  string avatar = 3;
  string password = 4;
  // Viewer preference: skip the blur/interstitial for warned templates.
  bool show_warned_content = 5;
  // Optional profile bio; trimmed server-side, 0-280 chars, empty clears.
  string bio = 6;
}

// UpdateProfileResponse is the response message for UpdateProfile.
message UpdateProfileResponse {
  string id = 1;
  string display_name = 2;
  string avatar = 3;
  bool show_warned_content = 4;
  string bio = 5;
}

// GetProfileRequest is the request message for GetProfile.
message GetProfileRequest {
  string id = 1;
}

// GetProfileResponse is the response message for GetProfile.
message GetProfileResponse {
  string id = 1;
  string email = 2;
  string display_name = 3;
  string avatar = 4;
  bool show_warned_content = 5;
  string bio = 6;
}

// FollowUserRequest is the request message for FollowUser/UnfollowUser.
message FollowUserRequest {
  string user_id = 1;     // followee
  string follower_id = 2; // injected by the gateway from auth context
}

// FollowUserResponse is the response message for FollowUser/UnfollowUser.
message FollowUserResponse {
  bool following = 1;
  int32 follower_count = 2;
}

// GetCreatorProfileRequest is the request message for GetCreatorProfile.
message GetCreatorProfileRequest {
  string user_id = 1;
  string viewer_id = 2; // empty for anonymous
}

// GetCreatorProfileResponse is the response message for GetCreatorProfile.
message GetCreatorProfileResponse {
  string id = 1;
  string display_name = 2;
  string avatar = 3;
  string bio = 4;
  int32 follower_count = 5;
  int32 following_count = 6;
  google.protobuf.Timestamp created_at = 7;
  bool is_following = 8;
  bool follows_you = 9;
}

// ListUserRelationsRequest is the request message for ListFollowers/ListFollowing.
message ListUserRelationsRequest {
  string user_id = 1;
  int32 page = 2;      // 1-based, default 1
  int32 page_size = 3; // default 20, max 50
}

// UserCard is the public identity of a user in relation lists.
message UserCard {
  string id = 1;
  string display_name = 2;
  string avatar = 3;
  int32 follower_count = 4;
  bool is_following = 5;
}

// ListUserRelationsResponse is the response message for ListFollowers/ListFollowing.
message ListUserRelationsResponse {
  repeated UserCard users = 1;
  int32 total_count = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// GetFollowingFeedRequest is the request message for GetFollowingFeed.
message GetFollowingFeedRequest {
  string user_id = 1;    // the follower (me)
  int32 page_size = 2;   // default 20, max 50
  string page_token = 3; // opaque created_at cursor
}

// GetFollowingFeedResponse is the response message for GetFollowingFeed.
message GetFollowingFeedResponse {
  repeated Template templates = 1;
  int32 total_count = 2;
  string next_page_token = 3;
}

// ListTopCreatorsRequest is the request message for ListTopCreators.
message ListTopCreatorsRequest {
  int32 limit = 1; // default 5, max 20
}

// ListTopCreatorsResponse is the response message for ListTopCreators.
message ListTopCreatorsResponse {
  repeated UserCard users = 1;
  int32 total_count = 2;
}

// OwnerInfo is the public owner identity on a template detail response.
message OwnerInfo {
  string id = 1;
  string display_name = 2;
  string avatar = 3;
  int32 follower_count = 4;
  bool is_following = 5;
}

// Alias messages
message Alias {
  string id = 1;
  string template_id = 2;
  string alias_name = 3;
  int32 version_id = 4;
}

message CreateAliasRequest {
  string template_id = 1;
  string alias_name = 2;
  int32 version_id = 3;
}

message ListAliasesRequest {
  string template_id = 1;
}

message ListAliasesResponse {
  repeated Alias aliases = 1;
}

message UpdateAliasRequest {
  string template_id = 1;
  string alias_name = 2;
  int32 version_id = 3;
}

message DeleteAliasRequest {
  string template_id = 1;
  string alias_name = 2;
}

message GetPromptByAliasRequest {
  string template_id = 1;
  string alias_name = 2;
}

// API Key Management

message APIKey {
  string id = 1;
  string user_id = 2;
  string name = 3;
  string prefix = 4; // Displayable part of the key
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp expires_at = 6;
  google.protobuf.Timestamp last_used_at = 7;
  bool is_active = 8;
}

message CreateAPIKeyRequest {
  string name = 1;
  int32 expires_days = 2; // Optional, 0 for unlimited or default
}

message CreateAPIKeyResponse {
  string id = 1;
  string api_key = 2; // The raw key, only shown once
  APIKey metadata = 3;
}

message ListAPIKeysRequest {
  string page_token = 1;
  int32 page_size = 2;
}

message ListAPIKeysResponse {
  repeated APIKey api_keys = 1;
  string next_page_token = 2;
}

message DeleteAPIKeyRequest {
  string id = 1;
}

message DeleteAPIKeyResponse {
  bool success = 1;
}

// CommentAuthor is the public identity of a comment's author.
message CommentAuthor {
  string id = 1;
  string display_name = 2;
  string avatar = 3;
}

// Comment represents a single comment on a template.
message Comment {
  string id = 1;
  string template_id = 2;
  string content = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  // True when updated_at > created_at (edited marker).
  bool is_edited = 6;
  CommentAuthor author = 7;
  // True when the comment was authored by the template owner.
  bool is_owner = 8;
  // True when the caller is the author (drives Edit/Delete affordances).
  bool is_own = 9;
}

message ListCommentsRequest {
  string template_id = 1;
  int32 page = 2; // 1-based, default 1
  int32 page_size = 3; // default 20, max 50
}

message ListCommentsResponse {
  repeated Comment comments = 1;
  int32 total_count = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message CreateCommentRequest {
  string template_id = 1;
  string content = 2; // 1-2000 chars after trim
}

message UpdateCommentRequest {
  string comment_id = 1;
  string content = 2; // 1-2000 chars after trim
}

message DeleteCommentRequest {
  string comment_id = 1;
}

message DeleteCommentResponse {
  bool success = 1;
}

// RecordTemplateEventRequest records a client-side view event.
message RecordTemplateEventRequest {
  // Template the event belongs to (required).
  string template_id = 1;
  // Event type; only "view" is accepted in v1 (required).
  string event_type = 2;
  // Client session id used for dedup (optional; empty = no dedup).
  string session_id = 3;
}

message RecordTemplateEventResponse {}

// TemplateStatsSummary is a range total for the four tracked metrics.
message TemplateStatsSummary {
  int32 views = 1;
  int32 uses = 2;
  int32 likes = 3;
  int32 favorites = 4;
}

// DailyMetricPoint is one UTC day of the daily series.
message DailyMetricPoint {
  // Day as YYYY-MM-DD (UTC).
  string date = 1;
  int32 views = 2;
  int32 uses = 3;
  int32 likes = 4;
  int32 favorites = 5;
}

// SourceSplit breaks down use events by origin.
message SourceSplit {
  int32 web = 1;
  int32 api = 2;
}

message GetTemplateStatsRequest {
  string template_id = 1;
  // 7, 30, or 90 (required; anything else is InvalidArgument).
  int32 days = 2;
}

message GetTemplateStatsResponse {
  // Totals for the requested range.
  TemplateStatsSummary current = 1;
  // Totals for the equivalent preceding range (delta baseline).
  TemplateStatsSummary previous = 2;
  // Zero-filled daily series, exactly `days` points, oldest first.
  repeated DailyMetricPoint series = 3;
  // Use-event source split for the requested range.
  SourceSplit source_split = 4;
  // uses / views for the range; 0 when views == 0.
  double view_to_use_rate = 5;
}

// TopTemplateRow is one row of the top-templates table.
message TopTemplateRow {
  string id = 1;
  string title = 2;
  int32 views = 3;
  int32 uses = 4;
  int32 likes = 5;
  int32 favorites = 6;
  // View→use rate for the range (uses / views; 0 when views == 0).
  double rate = 7;
}

message GetCreatorStatsRequest {
  // 7, 30, or 90 (required; anything else is InvalidArgument).
  int32 days = 1;
}

message GetCreatorStatsResponse {
  TemplateStatsSummary current = 1;
  TemplateStatsSummary previous = 2;
  repeated DailyMetricPoint series = 3;
  SourceSplit source_split = 4;
  // Top 10 of the caller's templates by uses in range (ties → views).
  repeated TopTemplateRow top_templates = 5;
  // Total templates owned by the caller (drives the empty state).
  int32 template_count = 6;
}
